<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 596" width="560" height="596" role="img" aria-labelledby="stn-title stn-desc">
  <title id="stn-title">Secure travel network flow</title>
  <desc id="stn-desc">Flow diagram: trusted personal devices connect to a GL.iNet GL-SFT1200 Opal travel router, which sends their traffic through an encrypted VPN gateway. The untrusted public Wi-Fi uplink carries only encrypted traffic to the internet. This reduces exposure on public networks; it is a mitigation, not a guarantee.</desc>
  <defs>
    <marker id="stn-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="594" rx="12" fill="#0a0f1a" stroke="#1e293b" stroke-width="2"/>

  <!-- 1. Trusted personal devices -->
  <rect x="60" y="28" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="73" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">01</text>
  <text x="280" y="60" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">Trusted personal devices</text>
  <text x="280" y="84" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">laptop and phone on the router's private network</text>
  <line x1="280" y1="112" x2="280" y2="134" stroke="#38bdf8" stroke-width="2" marker-end="url(#stn-arrow)"/>

  <!-- 2. Travel router -->
  <rect x="60" y="144" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="189" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">02</text>
  <text x="280" y="176" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">GL.iNet GL-SFT1200 Opal router</text>
  <text x="280" y="200" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">one hardened choke point for every device</text>
  <line x1="280" y1="228" x2="280" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#stn-arrow)"/>

  <!-- 3. Encrypted VPN gateway -->
  <rect x="60" y="260" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="305" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">03</text>
  <text x="280" y="292" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">Encrypted VPN gateway</text>
  <text x="280" y="316" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">traffic leaves the router inside an encrypted tunnel</text>
  <line x1="280" y1="344" x2="280" y2="366" stroke="#38bdf8" stroke-width="2" marker-end="url(#stn-arrow)"/>

  <!-- 4. Public Wi-Fi uplink -->
  <rect x="60" y="376" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="421" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">04</text>
  <text x="280" y="408" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">Public Wi-Fi uplink</text>
  <text x="280" y="432" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">untrusted venue network carries only encrypted traffic</text>
  <line x1="280" y1="460" x2="280" y2="482" stroke="#38bdf8" stroke-width="2" marker-end="url(#stn-arrow)"/>

  <!-- 5. Internet -->
  <rect x="60" y="492" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="537" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">05</text>
  <text x="280" y="524" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">Internet</text>
  <text x="280" y="548" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">reduced exposure: a mitigation, not a guarantee</text>
</svg>
