<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 596" width="560" height="596" role="img" aria-labelledby="dw-title dw-desc">
  <title id="dw-title">derekwei.xyz delivery pipeline</title>
  <desc id="dw-desc">Flow diagram: local development pushes to a private GitHub repository, which triggers a Cloudflare Pages build. The static output is served from the Cloudflare edge over HTTPS with strict security headers, and reaches the visitor's browser as prerendered HTML with no origin server.</desc>
  <defs>
    <marker id="dw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="594" rx="12" fill="#0a0f1a" stroke="#1e293b" stroke-width="2"/>

  <!-- 1. Local development -->
  <rect x="60" y="28" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="73" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">01</text>
  <text x="280" y="60" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">Local development</text>
  <text x="280" y="84" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">Astro site authored and verified locally</text>
  <line x1="280" y1="112" x2="280" y2="134" stroke="#38bdf8" stroke-width="2" marker-end="url(#dw-arrow)"/>

  <!-- 2. Private GitHub repository -->
  <rect x="60" y="144" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="189" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">02</text>
  <text x="280" y="176" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">Private GitHub repository</text>
  <text x="280" y="200" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">a push to main triggers the deployment</text>
  <line x1="280" y1="228" x2="280" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#dw-arrow)"/>

  <!-- 3. Cloudflare Pages build -->
  <rect x="60" y="260" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="305" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">03</text>
  <text x="280" y="292" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">Cloudflare Pages build</text>
  <text x="280" y="316" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">npm run build produces static dist/ output</text>
  <line x1="280" y1="344" x2="280" y2="366" stroke="#38bdf8" stroke-width="2" marker-end="url(#dw-arrow)"/>

  <!-- 4. Cloudflare edge + HTTPS -->
  <rect x="60" y="376" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="421" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">04</text>
  <text x="280" y="408" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">Cloudflare edge over HTTPS</text>
  <text x="280" y="432" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">served globally with strict security headers</text>
  <line x1="280" y1="460" x2="280" y2="482" stroke="#38bdf8" stroke-width="2" marker-end="url(#dw-arrow)"/>

  <!-- 5. Visitor browser -->
  <rect x="60" y="492" width="440" height="76" rx="10" fill="#101827" stroke="#334862" stroke-width="1.5"/>
  <text x="34" y="537" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6b7f9c" text-anchor="middle">05</text>
  <text x="280" y="524" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#e8eef6" text-anchor="middle">Visitor browser</text>
  <text x="280" y="548" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#9db0c6" text-anchor="middle">prerendered HTML, no origin server, no trackers</text>
</svg>
